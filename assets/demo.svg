<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Aperçu du panneau d'optimisation</title>
<desc id="d">Le panneau liste les onglets ouverts. Un clic sur Optimiser met les onglets inactifs en veille, ferme les doublons et fait baisser la mémoire utilisée.</desc>
<style>
text{font-family:"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif}
.ttl{font-size:18px;font-weight:700;fill:#E6EEF7}
.nm{font-size:16px;fill:#E6EEF7}
.meta{font-size:14px;fill:#8AA0BA}
.sweep{opacity:0;animation:sweep 12s ease-in-out infinite}
@keyframes sweep{0%,16%{opacity:0;transform:translateY(0)}18%{opacity:1;transform:translateY(0)}25%{opacity:1;transform:translateY(312px)}27%,100%{opacity:0;transform:translateY(312px)}}
.sleeprow{animation:sleepRow 12s ease-in-out infinite}
@keyframes sleepRow{0%,25%{opacity:1}31%,83%{opacity:.55}92%,100%{opacity:1}}
.before{animation:before 12s infinite}
@keyframes before{0%,25%{opacity:1}28%,91%{opacity:0}94%,100%{opacity:1}}
.after{opacity:0;animation:after 12s infinite}
@keyframes after{0%,26%{opacity:0}30%,88%{opacity:1}92%,100%{opacity:0}}
.closing{transform-box:fill-box;transform-origin:50% 0;animation:closing 12s ease-in-out infinite}
@keyframes closing{0%,28%{opacity:1;transform:scaleY(1)}35%,83%{opacity:0;transform:scaleY(0)}92%,100%{opacity:1;transform:scaleY(1)}}
.ring{stroke-dashoffset:127;animation:ring 12s ease-in-out infinite}
@keyframes ring{0%,30%{stroke-dashoffset:127}44%,83%{stroke-dashoffset:244}92%,100%{stroke-dashoffset:127}}
.n1{animation:n1 12s infinite}
@keyframes n1{0%,38%{opacity:1}42%,87%{opacity:0}92%,100%{opacity:1}}
.n2{opacity:0;animation:n2 12s infinite}
@keyframes n2{0%,38%{opacity:0}42%,87%{opacity:1}91%,100%{opacity:0}}
.btn{transform-box:fill-box;transform-origin:center;animation:press 12s infinite}
@keyframes press{0%,12%{transform:scale(1)}14%{transform:scale(.96)}17%,100%{transform:scale(1)}}
.btnbg{animation:btnbg 12s infinite}
@keyframes btnbg{0%,17%{fill:#3DD6F5}22%,88%{fill:#5EE6A8}94%,100%{fill:#3DD6F5}}
.lab1{animation:lab1 12s infinite}
@keyframes lab1{0%,16%{opacity:1}18%,91%{opacity:0}94%,100%{opacity:1}}
.lab2{opacity:0;animation:lab2 12s infinite}
@keyframes lab2{0%,16%{opacity:0}20%,88%{opacity:1}92%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.sweep,.sleeprow,.before,.after,.closing,.ring,.n1,.n2,.btn,.btnbg,.lab1,.lab2{animation:none}.after,.n2,.lab2,.sweep{opacity:0}}
</style>
<rect width="1000" height="540" rx="20" fill="#0E1A2B"/>
<rect width="1000" height="56" rx="20" fill="#0A1422"/>
<rect y="30" width="1000" height="26" fill="#0A1422"/>
<g transform="translate(24 12) scale(.25)">
  <circle cx="64" cy="64" r="40" fill="none" stroke="#263B57" stroke-width="10"/>
  <circle cx="64" cy="64" r="40" fill="none" stroke="#3DD6F5" stroke-width="10" stroke-linecap="round" stroke-dasharray="251.3" stroke-dashoffset="62" transform="rotate(-90 64 64)"/>
  <rect x="47" y="56" width="34" height="22" rx="5" fill="#E6EEF7"/>
</g>
<text x="64" y="34" font-size="18" font-weight="700" fill="#E6EEF7">ChromeOptimizer</text>
<text x="976" y="34" font-size="14" fill="#8AA0BA" text-anchor="end">Panneau d'optimisation</text>

<rect x="32" y="84" width="600" height="420" rx="16" fill="#162840"/>
<text class="ttl" x="56" y="120">Onglets ouverts</text>
<text class="meta" x="608" y="120" text-anchor="end">7 onglets</text>
  <g>
    <rect x="48" y="144" width="568" height="44" rx="10" fill="#12233A"/>
    <circle cx="72" cy="166" r="8" fill="#3DD6F5"/>
    <text class="nm" x="94" y="172">Messagerie</text>
    <text class="meta" x="596" y="172" text-anchor="end" fill="#3DD6F5" style="fill:#3DD6F5">actif</text>
  </g>
  <g class="sleeprow">
    <rect x="48" y="196" width="568" height="44" rx="10" fill="#12233A"/>
    <circle cx="72" cy="218" r="8" fill="#8AA0BA"/>
    <text class="nm" x="94" y="224">Documents partagés</text>
    <text class="meta before" x="596" y="224" text-anchor="end">inactif depuis 3 h</text>
    <rect class="after" x="496" y="205" width="100" height="26" rx="13" fill="#15405A"/>
    <text class="after" x="546" y="223" font-size="14" font-weight="600" fill="#3DD6F5" text-anchor="middle">En veille</text>
  </g>
  <g>
    <rect x="48" y="248" width="568" height="44" rx="10" fill="#12233A"/>
    <circle cx="72" cy="270" r="8" fill="#8AA0BA"/>
    <text class="nm" x="94" y="276">Article sur les volcans</text>
    <text class="meta" x="596" y="276" text-anchor="end">actif il y a 5 min</text>
  </g>
  <g class="sleeprow">
    <rect x="48" y="300" width="568" height="44" rx="10" fill="#12233A"/>
    <circle cx="72" cy="322" r="8" fill="#8AA0BA"/>
    <text class="nm" x="94" y="328">Lecteur vidéo</text>
    <text class="meta before" x="596" y="328" text-anchor="end">inactif depuis 1 h 20</text>
    <rect class="after" x="496" y="309" width="100" height="26" rx="13" fill="#15405A"/>
    <text class="after" x="546" y="327" font-size="14" font-weight="600" fill="#3DD6F5" text-anchor="middle">En veille</text>
  </g>
  <g>
    <rect x="48" y="352" width="568" height="44" rx="10" fill="#12233A"/>
    <circle cx="72" cy="374" r="8" fill="#8AA0BA"/>
    <text class="nm" x="94" y="380">Tableau de bord</text>
    <text class="meta" x="596" y="380" text-anchor="end">actif il y a 2 min</text>
  </g>
  <g class="closing">
    <rect x="48" y="404" width="568" height="44" rx="10" fill="#12233A"/>
    <circle cx="72" cy="426" r="8" fill="#FFB347"/>
    <text class="nm" x="94" y="432">Article sur les volcans</text>
    <rect x="516" y="413" width="80" height="26" rx="13" fill="#4A3716"/>
    <text x="556" y="431" font-size="14" font-weight="600" fill="#FFB347" text-anchor="middle">doublon</text>
  </g>
  <g class="closing">
    <rect x="48" y="456" width="568" height="44" rx="10" fill="#12233A"/>
    <circle cx="72" cy="478" r="8" fill="#FFB347"/>
    <text class="nm" x="94" y="484">Article sur les volcans</text>
    <rect x="516" y="465" width="80" height="26" rx="13" fill="#4A3716"/>
    <text x="556" y="483" font-size="14" font-weight="600" fill="#FFB347" text-anchor="middle">doublon</text>
  </g>
  
<rect class="sweep" x="48" y="144" width="568" height="44" rx="10" fill="#3DD6F5" fill-opacity=".2"/>

<rect x="656" y="84" width="312" height="420" rx="16" fill="#162840"/>
<text class="ttl" x="680" y="120">Mémoire utilisée</text>
<circle cx="812" cy="244" r="72" fill="none" stroke="#263B57" stroke-width="16"/>
<circle class="ring" cx="812" cy="244" r="72" fill="none" stroke="#3DD6F5" stroke-width="16" stroke-linecap="round" stroke-dasharray="452.4" transform="rotate(-90 812 244)"/>
<text class="n1" x="812" y="254" font-size="34" font-weight="700" fill="#E6EEF7" text-anchor="middle">2,4 Go</text>
<text class="n2" x="812" y="254" font-size="34" font-weight="700" fill="#5EE6A8" text-anchor="middle">1,5 Go</text>
<text x="812" y="278" font-size="14" fill="#8AA0BA" text-anchor="middle">sur 8 Go</text>

<g class="btn">
  <rect class="btnbg" x="680" y="360" width="264" height="52" rx="14" fill="#3DD6F5"/>
  <text class="lab1" x="812" y="392" font-size="17" font-weight="700" fill="#0E1A2B" text-anchor="middle">Optimiser maintenant</text>
  <text class="lab2" x="812" y="392" font-size="17" font-weight="700" fill="#0E1A2B" text-anchor="middle">Terminé</text>
</g>
<text class="meta before" x="812" y="448" text-anchor="middle">2 inactifs et 2 doublons détectés</text>
<text class="after" x="812" y="440" font-size="15" fill="#B7C7DA" text-anchor="middle">2 onglets mis en veille</text>
<text class="after" x="812" y="464" font-size="15" fill="#B7C7DA" text-anchor="middle">2 doublons fermés</text>
</svg>
