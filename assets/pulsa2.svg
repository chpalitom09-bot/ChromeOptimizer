<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-label="PULSA 2 : l'onglet est mis en veille, puis rechargé juste avant votre retour" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>PULSA 2 : l'onglet est mis en veille, puis rechargé juste avant votre retour</title><style>text{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.s{animation:hl 8s linear infinite}
.d1{animation-delay:0s}.d2{animation-delay:-6s}.d3{animation-delay:-4s}.d4{animation-delay:-2s}
