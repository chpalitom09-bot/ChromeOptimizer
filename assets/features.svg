<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Fonctionnalités de ChromeOptimizer</title>
<desc id="d">Onglets inactifs mis en veille, doublons fusionnés, aucune surveillance en boucle, onglets importants protégés.</desc>
<style>
text{font-family:"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif}
.z{opacity:0;animation:zfloat 3s ease-out infinite}
.z2{animation-delay:.9s}
.z3{animation-delay:1.8s}
@keyframes zfloat{0%{opacity:0;transform:translate(0,10px)}25%{opacity:1}100%{opacity:0;transform:translate(12px,-22px)}}
.twin{animation:merge 4s ease-in-out infinite}
@keyframes merge{0%,15%{transform:translate(22px,12px);opacity:1}55%,85%{transform:translate(0,0);opacity:0}85.1%{transform:translate(22px,12px);opacity:0}100%{transform:translate(22px,12px);opacity:1}}
.pulse{animation:run 3s linear infinite}
@keyframes run{0%{stroke-dashoffset:20}100%{stroke-dashoffset:-100}}
.check{animation:draw 4s ease-in-out infinite}
@keyframes draw{0%,10%{stroke-dashoffset:100}40%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:100}}
@media (prefers-reduced-motion:reduce){.z,.twin,.pulse,.check{animation:none}.z{opacity:.8}.check{stroke-dashoffset:0}}
</style>
<g>
  <rect x="0" y="0" width="490" height="200" rx="18" fill="#162840" stroke="#263B57"/>
  <g transform="translate(0 0)">
  <rect x="30" y="78" width="66" height="46" rx="8" fill="#1B3250" stroke="#3DD6F5" stroke-width="2"/>
  <rect x="30" y="78" width="66" height="12" rx="6" fill="#263B57"/>
  <text class="z z1" x="86" y="72" font-size="14" font-weight="700" fill="#3DD6F5">z</text>
  <text class="z z2" x="86" y="72" font-size="18" font-weight="700" fill="#3DD6F5">z</text>
  <text class="z z3" x="86" y="72" font-size="22" font-weight="700" fill="#3DD6F5">z</text></g>
  <text x="130" y="86" font-size="22" font-weight="700" fill="#E6EEF7">Onglets inactifs</text>
  <text x="130" y="118" font-size="14" fill="#8AA0BA">Mis en veille après le délai que vous choisissez.</text>
  <text x="130" y="140" font-size="14" fill="#8AA0BA">Un clic, et la page se recharge.</text>
</g>
<g>
  <rect x="510" y="0" width="490" height="200" rx="18" fill="#162840" stroke="#263B57"/>
  <g transform="translate(510 0)">
  <rect x="34" y="82" width="58" height="40" rx="8" fill="#1B3250" stroke="#3DD6F5" stroke-width="2"/>
  <rect class="twin" x="34" y="82" width="58" height="40" rx="8" fill="#4A3716" fill-opacity=".85" stroke="#FFB347" stroke-width="2"/></g>
  <text x="640" y="86" font-size="22" font-weight="700" fill="#E6EEF7">Doublons</text>
  <text x="640" y="118" font-size="14" fill="#8AA0BA">La même page ouverte plusieurs fois ?</text>
  <text x="640" y="140" font-size="14" fill="#8AA0BA">Une seule est conservée.</text>
</g>
<g>
  <rect x="0" y="220" width="490" height="200" rx="18" fill="#162840" stroke="#263B57"/>
  <g transform="translate(0 220)">
  <path d="M26 100 H52 L58 78 L66 118 L72 100 H110" pathLength="100" fill="none" stroke="#263B57" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="pulse" d="M26 100 H52 L58 78 L66 118 L72 100 H110" pathLength="100" fill="none" stroke="#3DD6F5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="20 80"/></g>
  <text x="130" y="306" font-size="22" font-weight="700" fill="#E6EEF7">Zéro surveillance</text>
  <text x="130" y="338" font-size="14" fill="#8AA0BA">Elle réagit aux événements de Chrome</text>
  <text x="130" y="360" font-size="14" fill="#8AA0BA">au lieu de scruter vos onglets en boucle.</text>
</g>
<g>
  <rect x="510" y="220" width="490" height="200" rx="18" fill="#162840" stroke="#263B57"/>
  <g transform="translate(510 220)">
  <g transform="translate(28 60)">
    <path d="M40 4 L68 14 V38 C68 56 56 68 40 74 C24 68 12 56 12 38 V14 Z" fill="#1B3250" stroke="#3DD6F5" stroke-width="2.5" stroke-linejoin="round"/>
    <path class="check" d="M27 40 L37 50 L55 30" pathLength="100" fill="none" stroke="#5EE6A8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="100"/>
  </g></g>
  <text x="640" y="306" font-size="22" font-weight="700" fill="#E6EEF7">Onglets protégés</text>
  <text x="640" y="338" font-size="14" fill="#8AA0BA">Onglet actif, épinglés, audio en cours</text>
  <text x="640" y="360" font-size="14" fill="#8AA0BA">et liste de sites à ne jamais toucher.</text>
</g>
</svg>
