<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Logo ChromeOptimizer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.arc{animation:breathe 4s ease-in-out infinite}
@keyframes breathe{0%,100%{stroke-dashoffset:62}50%{stroke-dashoffset:44}}
