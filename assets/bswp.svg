<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">BSWP : charger d'abord ce qui est visible</title>
  <desc id="d">À gauche, sans BSWP, toutes les images d'une page se chargent d'un coup. À droite, avec BSWP, seules les images proches de la zone visible se chargent, les autres attendent que la zone visible approche.</desc>
  <defs>
    <clipPath id="c"><rect width="320" height="28" rx="7"/></clipPath>
    <g id="pic" clip-path="url(#c)">
      <rect width="320" height="28" fill="#1b1b1e"/>
      <path d="M0 28L80 10 130 22 200 6 320 28Z" fill="#2c2c31"/>
      <circle cx="268" cy="9" r="4.5" fill="#4a4a52"/>
    </g>
  </defs>
  <style>
    text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
    .h{font-size:15px;font-weight:700;fill:#f5f5f6}
    .mu{font-size:13px;fill:#a1a1a9}
    .ph{fill:none;stroke:#37373d;stroke-dasharray:5 5}
    .ld{opacity:0}
    .l3{animation:k3 9s ease-in-out infinite}
    .l4{animation:k4 9s ease-in-out infinite}
    .l5{animation:k5 9s ease-in-out infinite}
    @keyframes k3{0%,26%{opacity:0}32%,94%{opacity:1}99%,100%{opacity:0}}
    @keyframes k4{0%,44%{opacity:0}50%,94%{opacity:1}99%,100%{opacity:0}}
    @keyframes k5{0%,62%{opacity:0}68%,94%{opacity:1}99%,100%{opacity:0}}
    .vp{animation:kvp 9s ease-in-out infinite}
    @keyframes kvp{0%,12%{transform:translateY(0)}70%,86%{transform:translateY(112px)}98%,100%{transform:translateY(0)}}
    .cap2{animation:kc 9s ease-in-out infinite}
    @keyframes kc{0%,60%{opacity:1}64%,92%{opacity:0}96%,100%{opacity:1}}
    .cap3{opacity:0;animation:kc3 9s ease-in-out infinite}
    @keyframes kc3{0%,60%{opacity:0}64%,92%{opacity:1}96%,100%{opacity:0}}
    @media (prefers-reduced-motion:reduce){
      .l3,.l4,.l5{animation:none;opacity:0}.vp{animation:none}.cap2{animation:none;opacity:1}.cap3{animation:none;opacity:0}
    }
  </style>
  <rect x=".5" y=".5" width="879" height="319" rx="24" fill="#09090a" stroke="#26262a"/>

  <!-- sans BSWP -->
  <text class="h" x="40" y="36">Sans BSWP</text>
  <rect x="40" y="50" width="380" height="232" rx="16" fill="#0e0e10" stroke="#26262a"/>
  <circle cx="60" cy="66" r="3.5" fill="#37373d"/><circle cx="73" cy="66" r="3.5" fill="#37373d"/><circle cx="86" cy="66" r="3.5" fill="#37373d"/>
  <g transform="translate(70 84)"><use href="#pic"/></g>
  <g transform="translate(70 122)"><use href="#pic"/></g>
  <g transform="translate(70 160)"><use href="#pic"/></g>
  <g transform="translate(70 198)"><use href="#pic"/></g>
  <g transform="translate(70 236)"><use href="#pic"/></g>
  <text class="mu" x="40" y="308">Tout se charge d'un coup</text>

  <!-- avec BSWP -->
  <text class="h" x="460" y="36">Avec BSWP</text>
  <rect x="460" y="50" width="380" height="232" rx="16" fill="#0e0e10" stroke="#26262a"/>
  <circle cx="480" cy="66" r="3.5" fill="#37373d"/><circle cx="493" cy="66" r="3.5" fill="#37373d"/><circle cx="506" cy="66" r="3.5" fill="#37373d"/>
  <g transform="translate(490 84)"><use href="#pic"/></g>
  <g transform="translate(490 122)"><use href="#pic"/></g>
  <rect class="ph" x="490.5" y="160.5" width="319" height="27" rx="7"/>
  <rect class="ph" x="490.5" y="198.5" width="319" height="27" rx="7"/>
  <rect class="ph" x="490.5" y="236.5" width="319" height="27" rx="7"/>
  <g class="ld l3" transform="translate(490 160)"><use href="#pic"/></g>
  <g class="ld l4" transform="translate(490 198)"><use href="#pic"/></g>
  <g class="ld l5" transform="translate(490 236)"><use href="#pic"/></g>
  <g class="vp">
    <rect x="476" y="74" width="348" height="84" rx="12" fill="none" stroke="#f5f5f6" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="816" y="90" text-anchor="end" font-size="11" fill="#f5f5f6">zone visible</text>
  </g>
  <text class="mu cap2" x="460" y="308">Le visible d'abord</text>
  <text class="mu cap3" x="460" y="308">Le reste arrive à l'approche</text>
</svg>
