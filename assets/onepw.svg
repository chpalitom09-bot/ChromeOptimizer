<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">1PW : un seul onglet reste éveillé</title>
  <desc id="d">Cinq onglets sont ouverts. Quand 1PW s'active sur le jeu, les quatre autres onglets passent en veille et la mémoire utilisée baisse.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1d1d21"/></pattern>
  </defs>
  <style>
    text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
    .tab{fill:#141416;stroke:#26262a}
    .tabon{fill:#1b1b1e;stroke:#f5f5f6;stroke-width:1.5}
    .tt{font-size:14px;fill:#f5f5f6}
    .mu{font-size:13px;fill:#a1a1a9}
    .dm{font-size:12px;fill:#6f6f78}
    .sl{animation:kdim 9s ease-in-out infinite}
    @keyframes kdim{0%,20%{opacity:1}32%,82%{opacity:.32}94%,100%{opacity:1}}
    .z{font-size:14px;font-weight:700;fill:#f5f5f6;opacity:0;animation:kz 9s ease-out infinite}
    .z2{animation-delay:.25s}.z3{animation-delay:.5s}
    @keyframes kz{0%,30%{opacity:0}36%{opacity:.9}52%{opacity:0}56%{opacity:0}62%{opacity:.9}78%{opacity:0}100%{opacity:0}}
    .knob{animation:ktog 9s ease-in-out infinite}
    @keyframes ktog{0%,16%{transform:translateX(0)}22%,88%{transform:translateX(20px)}94%,100%{transform:translateX(0)}}
    .on{opacity:0;animation:kon 9s ease-in-out infinite}
    @keyframes kon{0%,16%{opacity:0}22%,88%{opacity:1}94%,100%{opacity:0}}
    .bx{animation:kbx 2.6s linear infinite alternate}
    @keyframes kbx{to{transform:translateX(720px)}}
    .by{animation:kby .9s cubic-bezier(.5,0,.5,1) infinite alternate}
    @keyframes kby{to{transform:translateY(46px)}}
    .fill{transform-box:fill-box;transform-origin:0 50%;animation:kmem 9s ease-in-out infinite}
    @keyframes kmem{0%,20%{transform:scaleX(.78)}34%,82%{transform:scaleX(.36)}94%,100%{transform:scaleX(.78)}}
    .va{animation:kva 9s ease-in-out infinite}
    @keyframes kva{0%,20%{opacity:1}30%,84%{opacity:0}94%,100%{opacity:1}}
    .vb{opacity:0;animation:kvb 9s ease-in-out infinite}
    @keyframes kvb{0%,20%{opacity:0}30%,84%{opacity:1}94%,100%{opacity:0}}
    @media (prefers-reduced-motion:reduce){
      .sl{animation:none;opacity:.4}.z{animation:none;opacity:.8}.on{animation:none;opacity:1}
      .knob{animation:none;transform:translateX(20px)}.bx,.by{animation:none}
      .fill{animation:none;transform:scaleX(.36)}.va{animation:none;opacity:0}.vb{animation:none;opacity:1}
    }
  </style>
  <rect x=".5" y=".5" width="879" height="319" rx="24" fill="#09090a" stroke="#26262a"/>

  <!-- interrupteur 1PW -->
  <rect x="40" y="22" width="44" height="24" rx="12" fill="#26262a"/>
  <rect class="on" x="40" y="22" width="44" height="24" rx="12" fill="#1a9d5a"/>
  <circle class="knob" cx="52" cy="34" r="9" fill="#f5f5f6"/>
  <text x="96" y="39" font-size="15" font-weight="700" fill="#f5f5f6">1PW (β)</text>
  <text class="mu" x="840" y="39" text-anchor="end">Un onglet prioritaire, tous les autres en veille</text>

  <!-- onglets -->
  <rect class="tabon" x="40" y="60" width="152" height="52" rx="14"/>
  <text class="tt" x="56" y="91">Jeu en cours</text>
  <g class="on"><rect x="152" y="77" width="30" height="20" rx="10" fill="#1a9d5a"/><text x="167" y="91" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">1PW</text></g>

  <g class="sl"><rect class="tab" x="202" y="60" width="152" height="52" rx="14"/><text class="tt" x="218" y="91">Messagerie</text></g>
  <g class="sl"><rect class="tab" x="364" y="60" width="152" height="52" rx="14"/><text class="tt" x="380" y="91">Article</text></g>
  <g class="sl"><rect class="tab" x="526" y="60" width="152" height="52" rx="14"/><text class="tt" x="542" y="91">Vidéo</text></g>
  <g class="sl"><rect class="tab" x="688" y="60" width="152" height="52" rx="14"/><text class="tt" x="704" y="91">Documents</text></g>
  <g>
    <text class="z" x="320" y="88">z</text><text class="z z2" x="332" y="82" font-size="16">z</text><text class="z z3" x="344" y="76" font-size="18">z</text>
    <text class="z" x="482" y="88">z</text><text class="z z2" x="494" y="82">z</text><text class="z z3" x="506" y="76">z</text>
    <text class="z" x="644" y="88">z</text><text class="z z2" x="656" y="82">z</text><text class="z z3" x="668" y="76">z</text>
    <text class="z" x="806" y="88">z</text><text class="z z2" x="818" y="82">z</text><text class="z z3" x="830" y="76">z</text>
  </g>

  <!-- le jeu -->
  <rect x="40" y="130" width="800" height="100" rx="16" fill="#0e0e10" stroke="#26262a"/>
  <rect x="40" y="130" width="800" height="100" rx="16" fill="url(#grid)"/>
  <g class="bx"><circle class="by" cx="72" cy="156" r="9" fill="#f5f5f6"/></g>

  <!-- mémoire -->
  <text class="mu" x="40" y="262">Mémoire utilisée</text>
  <text class="va" x="840" y="262" text-anchor="end" font-size="14" font-weight="700" fill="#f5f5f6">3,1 Go</text>
  <text class="vb" x="840" y="262" text-anchor="end" font-size="14" font-weight="700" fill="#f5f5f6">1,4 Go</text>
  <rect x="40" y="272" width="800" height="10" rx="5" fill="#26262a"/>
  <rect class="fill" x="40" y="272" width="800" height="10" rx="5" fill="#f5f5f6"/>
  <text class="dm" x="840" y="306" text-anchor="end">Valeurs illustratives</text>
</svg>
