<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">EcoOptimizer : des cycles plus lents quand la batterie baisse</title>
  <desc id="d">Quand la batterie passe sous 40, 30, 20 puis 10 pour cent, les cycles de vérification de l'extension sont 5, 10, 15 puis 30 pour cent plus lents.</desc>
  <style>
    text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
    .mu{font-size:13px;fill:#a1a1a9}
    .dm{font-size:12px;fill:#6f6f78}
    .lb{font-size:15px;font-weight:700;fill:#f5f5f6}
    .vl{font-size:15px;font-weight:700;fill:#f5f5f6;text-anchor:end}
    .bat{transform-box:fill-box;transform-origin:0 50%;animation:kbat 10s linear infinite}
    @keyframes kbat{0%,12%{transform:scaleX(1)}20%,32%{transform:scaleX(.4)}38%,50%{transform:scaleX(.3)}56%,68%{transform:scaleX(.2)}74%,90%{transform:scaleX(.1)}98%,100%{transform:scaleX(1)}}
    .b{transform-box:fill-box;transform-origin:0 50%;transform:scaleX(0)}
    .b1{animation:kb1 10s ease-out infinite}.b2{animation:kb2 10s ease-out infinite}.b3{animation:kb3 10s ease-out infinite}.b4{animation:kb4 10s ease-out infinite}
    @keyframes kb1{0%,20%{transform:scaleX(0)}27%,92%{transform:scaleX(1)}98%,100%{transform:scaleX(0)}}
    @keyframes kb2{0%,38%{transform:scaleX(0)}45%,92%{transform:scaleX(1)}98%,100%{transform:scaleX(0)}}
    @keyframes kb3{0%,56%{transform:scaleX(0)}63%,92%{transform:scaleX(1)}98%,100%{transform:scaleX(0)}}
    @keyframes kb4{0%,74%{transform:scaleX(0)}81%,92%{transform:scaleX(1)}98%,100%{transform:scaleX(0)}}
    .p{opacity:0;font-size:16px;font-weight:700;fill:#f5f5f6;text-anchor:middle}
    .p0{animation:kp0 10s infinite}.p1{animation:kp1 10s infinite}.p2{animation:kp2 10s infinite}.p3{animation:kp3 10s infinite}.p4{animation:kp4 10s infinite}
    @keyframes kp0{0%,15%{opacity:1}17%,96%{opacity:0}98%,100%{opacity:1}}
    @keyframes kp1{0%,16%{opacity:0}18%,33%{opacity:1}35%,100%{opacity:0}}
    @keyframes kp2{0%,34%{opacity:0}36%,51%{opacity:1}53%,100%{opacity:0}}
    @keyframes kp3{0%,52%{opacity:0}54%,69%{opacity:1}71%,100%{opacity:0}}
    @keyframes kp4{0%,70%{opacity:0}72%,96%{opacity:1}98%,100%{opacity:0}}
    @media (prefers-reduced-motion:reduce){
      .bat{animation:none;transform:scaleX(.3)}.b{animation:none;transform:scaleX(1)}.p{animation:none}.p2{opacity:1}
    }
  </style>
  <rect x=".5" y=".5" width="879" height="299" rx="24" fill="#09090a" stroke="#26262a"/>

  <!-- batterie -->
  <rect x="60" y="94" width="160" height="84" rx="14" fill="none" stroke="#a1a1a9" stroke-width="3"/>
  <rect x="224" y="120" width="10" height="32" rx="4" fill="#a1a1a9"/>
  <rect class="bat" x="68" y="102" width="144" height="68" rx="8" fill="#f5f5f6"/>
  <g transform="translate(140 214)">
    <text class="p p0">100 %</text><text class="p p1">40 %</text><text class="p p2">30 %</text><text class="p p3">20 %</text><text class="p p4">10 %</text>
  </g>
  <text class="mu" x="140" y="240" text-anchor="middle">Batterie</text>

  <!-- paliers -->
  <text class="mu" x="300" y="46">Cycles de vérification plus lents de</text>
  <g>
    <text class="lb" x="300" y="86">≤ 40 %</text><rect x="390" y="76" width="360" height="10" rx="5" fill="#26262a"/><rect class="b b1" x="390" y="76" width="60" height="10" rx="5" fill="#f5f5f6"/><text class="vl" x="840" y="86">+5 %</text>
    <text class="lb" x="300" y="130">≤ 30 %</text><rect x="390" y="120" width="360" height="10" rx="5" fill="#26262a"/><rect class="b b2" x="390" y="120" width="120" height="10" rx="5" fill="#f5f5f6"/><text class="vl" x="840" y="130">+10 %</text>
    <text class="lb" x="300" y="174">≤ 20 %</text><rect x="390" y="164" width="360" height="10" rx="5" fill="#26262a"/><rect class="b b3" x="390" y="164" width="180" height="10" rx="5" fill="#f5f5f6"/><text class="vl" x="840" y="174">+15 %</text>
    <text class="lb" x="300" y="218">≤ 10 %</text><rect x="390" y="208" width="360" height="10" rx="5" fill="#26262a"/><rect class="b b4" x="390" y="208" width="360" height="10" rx="5" fill="#f5f5f6"/><text class="vl" x="840" y="218">+30 %</text>
  </g>
  <text class="dm" x="300" y="258">Sous 20 %, l'historique des sites se met en pause. Sous 10 %, BSWP aussi.</text>
  <text class="dm" x="300" y="276">Sur secteur, rien ne change.</text>
</svg>
