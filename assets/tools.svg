<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-label="Bloqueur de pubs, préchargement au survol et vidéos hors écran" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Bloqueur de pubs, préchargement au survol et vidéos hors écran</title><style>text{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.strike{transform-origin:0 0;animation:st 6s ease-in-out infinite}
@keyframes st{0%,15%{transform:scaleX(0)}35%,85%{transform:scaleX(1)}100%{transform:scaleX(0)}}
.bar{transform-origin:0 0;animation:pg 6s ease-in-out infinite}
@keyframes pg{0%,20%{transform:scaleX(.05)}60%,90%{transform:scaleX(1)}100%{transform:scaleX(.05)}}
.pz{animation:pz 6s ease-in-out infinite}
@keyframes pz{0%,30%{opacity:0}50%,90%{opacity:1}100%{opacity:0}}
.pl{animation:pl 6s ease-in-out infinite}
@keyframes pl{0%,30%{opacity:1}50%,90%{opacity:0}100%{opacity:1}}
.cur{animation:cu 6s ease-in-out infinite}
@keyframes cu{0%,10%{transform:translate(0,0)}25%,90%{transform:translate(0,-26px)}100%{transform:translate(0,0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="960" height="300" rx="16" fill="#141416"/><rect x="40" y="28" width="260" height="244" rx="12" fill="#1d1d21" stroke="#2c2c31"/><text x="60" y="58" fill="#F5F5F6" font-size="16" font-weight="700">Bloqueur de pubs</text><text x="60" y="78" fill="#8b8b93" font-size="12.5">pages plus légères</text><rect x="350" y="28" width="260" height="244" rx="12" fill="#1d1d21" stroke="#2c2c31"/><text x="370" y="58" fill="#F5F5F6" font-size="16" font-weight="700">Préchargement au survol</text><text x="370" y="78" fill="#8b8b93" font-size="12.5">prête avant le clic</text><rect x="660" y="28" width="260" height="244" rx="12" fill="#1d1d21" stroke="#2c2c31"/><text x="680" y="58" fill="#F5F5F6" font-size="16" font-weight="700">Vidéos hors écran</text><text x="680" y="78" fill="#8b8b93" font-size="12.5">les vidéos muettes en pause</text><rect x="60" y="96" width="220" height="150" rx="8" fill="#141416" stroke="#2c2c31"/><rect x="74" y="110" width="120" height="8" rx="4" fill="#F5F5F6" opacity=".7"/><rect x="74" y="126" width="190" height="6" rx="3" fill="#F5F5F6" opacity=".3"/><rect x="74" y="140" width="170" height="6" rx="3" fill="#F5F5F6" opacity=".3"/><rect x="74" y="162" width="192" height="52" rx="6" fill="#2c2c31"/><text x="170" y="193" text-anchor="middle" fill="#8b8b93" font-size="13">Publicité</text><g transform="translate(74 188)"><rect class="strike" width="192" height="3" rx="1.5" fill="#e67e22"/></g><rect x="74" y="224" width="140" height="6" rx="3" fill="#F5F5F6" opacity=".3"/><rect x="370" y="96" width="220" height="150" rx="8" fill="#141416" stroke="#2c2c31"/><text x="386" y="128" fill="#F5F5F6" font-size="14" text-decoration="underline">Lire la suite</text><rect x="386" y="150" width="188" height="6" rx="3" fill="#F5F5F6" opacity=".3"/><rect x="386" y="166" width="150" height="6" rx="3" fill="#F5F5F6" opacity=".3"/><rect x="386" y="204" width="188" height="8" rx="4" fill="#2c2c31"/><g transform="translate(386 204)"><rect class="bar" width="188" height="8" rx="4" fill="#e67e22"/></g><text x="386" y="232" fill="#8b8b93" font-size="12">chargement en arrière-plan</text><g class="cur" transform="translate(442 156)"><path d="M0 0L0 18L5 14L9 22L12 20.5L8 13L14 13Z" fill="#F5F5F6"/></g><rect x="680" y="96" width="220" height="150" rx="8" fill="#141416" stroke="#2c2c31"/><rect x="694" y="110" width="192" height="64" rx="6" fill="#2c2c31"/><g class="pl"><path d="M772 128L772 156L798 142Z" fill="#F5F5F6" opacity=".6"/></g><g class="pz"><rect x="772" y="128" width="8" height="28" rx="2" fill="#e67e22"/><rect x="786" y="128" width="8" height="28" rx="2" fill="#e67e22"/></g><rect x="694" y="190" width="150" height="6" rx="3" fill="#F5F5F6" opacity=".3"/><rect x="694" y="206" width="190" height="6" rx="3" fill="#F5F5F6" opacity=".3"/><rect x="694" y="222" width="110" height="6" rx="3" fill="#F5F5F6" opacity=".3"/></svg>