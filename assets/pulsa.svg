<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">PULSA : un score de réutilisation par onglet</title>
<desc id="d">Chaque onglet inactif reçoit un score de 0 à 100. Sous le seuil, il est mis en veille.</desc>
<style>
.f{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
.bar{transform-box:fill-box;transform-origin:left center;animation:grow 1.6s cubic-bezier(.2,.7,.2,1) both}
.b2{animation-delay:.15s}.b3{animation-delay:.3s}.b4{animation-delay:.45s}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.thr{animation:pulse 3s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.bar,.thr{animation:none}}
</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#141416"/><stop offset="1" stop-color="#0E0E10"/></linearGradient></defs>
<rect width="1000" height="330" rx="20" fill="url(#bg)" stroke="#26262A"/>
<g class="f">
<text x="40" y="52" font-size="22" font-weight="700" fill="#F5F5F6">PULSA</text>
<text x="132" y="52" font-size="14" fill="#A1A1A9">Predictive Usage Scoring and Lifecycle Algorithm</text>
<text x="960" y="52" font-size="13" fill="#A1A1A9" text-anchor="end">Valeurs d'exemple</text>
<line x1="40" y1="72" x2="960" y2="72" stroke="#26262A"/>

<text x="40" y="115" font-size="15" fill="#F5F5F6">messagerie</text>
<rect x="250" y="100" width="400" height="14" rx="7" fill="#1B1B1E"/>
<rect class="bar" x="250" y="100" width="344" height="14" rx="7" fill="#F5F5F6"/>
<text x="670" y="113" font-size="14" font-weight="700" fill="#F5F5F6">86</text>
<rect x="760" y="97" width="200" height="22" rx="11" fill="#1B1B1E" stroke="#26262A"/>
<text x="860" y="112" font-size="12" fill="#C4C4C9" text-anchor="middle">reste actif</text>

<text x="40" y="159" font-size="15" fill="#F5F5F6">documents</text>
<rect x="250" y="144" width="400" height="14" rx="7" fill="#1B1B1E"/>
<rect class="bar b2" x="250" y="144" width="244" height="14" rx="7" fill="#C4C4C9"/>
<text x="670" y="157" font-size="14" font-weight="700" fill="#F5F5F6">61</text>
<rect x="760" y="141" width="200" height="22" rx="11" fill="#1B1B1E" stroke="#26262A"/>
<text x="860" y="156" font-size="12" fill="#C4C4C9" text-anchor="middle">reste actif</text>

<text x="40" y="203" font-size="15" fill="#F5F5F6">article</text>
<rect x="250" y="188" width="400" height="14" rx="7" fill="#1B1B1E"/>
<rect class="bar b3" x="250" y="188" width="108" height="14" rx="7" fill="#6F6F78"/>
<text x="670" y="201" font-size="14" font-weight="700" fill="#F5F5F6">27</text>
<rect x="760" y="185" width="200" height="22" rx="11" fill="#F5F5F6"/>
<text x="860" y="200" font-size="12" font-weight="700" fill="#09090A" text-anchor="middle">mis en veille</text>

<text x="40" y="247" font-size="15" fill="#F5F5F6">vidéo</text>
<rect x="250" y="232" width="400" height="14" rx="7" fill="#1B1B1E"/>
<rect class="bar b4" x="250" y="232" width="36" height="14" rx="7" fill="#6F6F78"/>
<text x="670" y="245" font-size="14" font-weight="700" fill="#F5F5F6">9</text>
<rect x="760" y="229" width="200" height="22" rx="11" fill="#F5F5F6"/>
<text x="860" y="244" font-size="12" font-weight="700" fill="#09090A" text-anchor="middle">mis en veille</text>

<line class="thr" x1="370" y1="88" x2="370" y2="262" stroke="#F5F5F6" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="370" y="80" font-size="11" fill="#A1A1A9" text-anchor="middle">seuil</text>
<text x="40" y="300" font-size="13" fill="#A1A1A9">Plus le score est bas, moins l'onglet a de chances d'être rouvert dans l'heure.</text>
</g>
</svg>
