<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 12" width="1000" height="12" role="separator" aria-hidden="true" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#3DD6F5" stop-opacity="0"/><stop offset=".5" stop-color="#3DD6F5"/><stop offset="1" stop-color="#3DD6F5" stop-opacity="0"/></linearGradient>
</defs>
<style>
.glow{animation:run 5s ease-in-out infinite}
@keyframes run{0%{transform:translateX(-160px)}100%{transform:translateX(1000px)}}
@media (prefers-reduced-motion:reduce){.glow{animation:none;transform:translateX(420px)}}
</style>
<rect x="0" y="5" width="1000" height="2" rx="1" fill="#3DD6F5" opacity=".22"/>
<rect class="glow" x="0" y="4" width="160" height="4" rx="2" fill="url(#g)"/>
</svg>
