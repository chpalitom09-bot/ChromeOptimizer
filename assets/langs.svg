<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 150" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Six langues</title>
  <desc id="d">L'interface existe en français, anglais, espagnol, allemand, chinois et russe. Un bouton avec le drapeau change la langue.</desc>
  <style>
    text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
    .mu{font-size:13px;fill:#a1a1a9}
    .n{font-size:14px;fill:#f5f5f6}
    .s{font-size:11px;fill:#6f6f78}
    .chip{fill:#141416;stroke:#37373d;animation:khl 12s ease-in-out infinite}
    @keyframes khl{0%,15%{fill:#1b1b1e;stroke:#f5f5f6}18%,100%{fill:#141416;stroke:#37373d}}
    @media (prefers-reduced-motion:reduce){.chip{animation:none}}
  </style>
  <rect x=".5" y=".5" width="879" height="149" rx="24" fill="#09090a" stroke="#26262a"/>
  <text class="mu" x="440" y="40" text-anchor="middle">Un bouton avec le drapeau change la langue de l'extension</text>

