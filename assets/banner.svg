<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">ChromeOptimizer</title>
<desc id="d">Une rangée d'onglets : les onglets inactifs passent en veille, le doublon se referme et la mémoire utilisée baisse.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0E1A2B"/><stop offset="1" stop-color="#132740"/></linearGradient>
</defs>
<style>
text{font-family:"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif}
.sleep{animation:sleep 10s ease-in-out infinite}
@keyframes sleep{0%,20%{opacity:1}28%,84%{opacity:.4}94%,100%{opacity:1}}
.zz{opacity:0;animation:zz 10s ease-in-out infinite}
@keyframes zz{0%,24%{opacity:0}30%,84%{opacity:1}92%,100%{opacity:0}}
.dupbg{animation:flash 10s infinite}
@keyframes flash{0%,34%{fill:#162840}38%,42%{fill:#5A4220}48%,100%{fill:#162840}}
.duptag{opacity:0;animation:tag 10s infinite}
@keyframes tag{0%,35%{opacity:0}38%,44%{opacity:1}48%,100%{opacity:0}}
.dup{transform-box:fill-box;transform-origin:0 50%;animation:collapse 10s ease-in-out infinite}
@keyframes collapse{0%,48%{transform:scaleX(1);opacity:1}58%,86%{transform:scaleX(0);opacity:0}94%,100%{transform:scaleX(1);opacity:1}}
.shift{animation:shift 10s ease-in-out infinite}
@keyframes shift{0%,48%{transform:translateX(0)}58%,86%{transform:translateX(-182px)}94%,100%{transform:translateX(0)}}
.ram{transform-box:fill-box;transform-origin:0 50%;animation:ram 10s ease-in-out infinite}
@keyframes ram{0%,46%{transform:scaleX(1)}62%,86%{transform:scaleX(.55)}94%,100%{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){.sleep,.zz,.dupbg,.duptag,.dup,.shift,.ram{animation:none}}
</style>
<rect width="1200" height="340" rx="24" fill="url(#bg)"/>

<g transform="translate(64 44) scale(.62)">
  <circle cx="64" cy="64" r="40" fill="none" stroke="#263B57" stroke-width="10"/>
  <circle cx="64" cy="64" r="40" fill="none" stroke="#3DD6F5" stroke-width="10" stroke-linecap="round" stroke-dasharray="251.3" stroke-dashoffset="62" transform="rotate(-90 64 64)"/>
  <rect x="47" y="50" width="34" height="8" rx="2.5" fill="#E6EEF7"/>
  <rect x="47" y="56" width="34" height="22" rx="5" fill="#E6EEF7"/>
  <rect x="52" y="62" width="24" height="3" rx="1.5" fill="#0E1A2B"/>
  <rect x="52" y="69" width="15" height="3" rx="1.5" fill="#3DD6F5"/>
</g>
<text x="150" y="108" font-size="60" font-weight="800" fill="#E6EEF7">ChromeOptimizer</text>
<text x="64" y="172" font-size="25" fill="#B7C7DA">Libérez la mémoire de Chrome sans y penser.</text>
<text x="64" y="204" font-size="17" fill="#8AA0BA">Onglets inactifs en veille, doublons fermés, aucune surveillance en boucle.</text>

<rect x="976" y="46" width="160" height="34" rx="17" fill="none" stroke="#FFB347" stroke-width="1.5"/>
<text x="1056" y="68" font-size="14" font-weight="600" fill="#FFB347" text-anchor="middle">En développement</text>

<rect x="48" y="236" width="1104" height="80" rx="16" fill="#0A1422"/>
<g>
  <g>
    <rect x="64" y="250" width="172" height="52" rx="10" fill="#1B3250" stroke="#3DD6F5" stroke-width="1.5"/>
    <circle cx="88" cy="276" r="7" fill="#3DD6F5"/>
    <text x="106" y="281" font-size="15" fill="#E6EEF7">Messagerie</text>
  </g>
</g>
<g>
  <g class="sleep">
    <rect x="246" y="250" width="172" height="52" rx="10" fill="#162840"/>
    <circle cx="270" cy="276" r="7" fill="#8AA0BA"/>
    <text x="288" y="281" font-size="15" fill="#E6EEF7">Documents</text>
  </g>
  <text class="zz" x="388" y="281" font-size="14" font-weight="700" fill="#3DD6F5">zz</text>
</g>
<g>
  <g>
    <rect x="428" y="250" width="172" height="52" rx="10" fill="#162840"/>
    <circle cx="452" cy="276" r="7" fill="#8AA0BA"/>
    <text x="470" y="281" font-size="15" fill="#E6EEF7">Article</text>
  </g>
</g>
<g class="dup">
  <g>
    <rect class="dupbg" x="610" y="250" width="172" height="52" rx="10" fill="#162840"/>
    <circle cx="634" cy="276" r="7" fill="#8AA0BA"/>
    <text x="652" y="281" font-size="15" fill="#E6EEF7">Article</text>
  </g>
  <text class="duptag" x="714" y="281" font-size="13" font-weight="600" fill="#FFB347">doublon</text>
</g>
<g class="shift">
  <g class="sleep">
    <rect x="792" y="250" width="172" height="52" rx="10" fill="#162840"/>
    <circle cx="816" cy="276" r="7" fill="#8AA0BA"/>
    <text x="834" y="281" font-size="15" fill="#E6EEF7">Vidéo</text>
  </g>
  <text class="zz" x="934" y="281" font-size="14" font-weight="700" fill="#3DD6F5">zz</text>
</g>
<text x="1000" y="262" font-size="13" fill="#8AA0BA">Mémoire utilisée</text>
<rect x="1000" y="274" width="136" height="10" rx="5" fill="#263B57"/>
<rect class="ram" x="1000" y="274" width="136" height="10" rx="5" fill="#3DD6F5"/>
</svg>
