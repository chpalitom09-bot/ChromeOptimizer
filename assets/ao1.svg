<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-label="AO1 : chaque téléchargement reçoit une note de A+ à F" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>AO1 : chaque téléchargement reçoit une note de A+ à F</title><style>text{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.sel{animation:sel 8s ease-in-out infinite}
@keyframes sel{0%,40%{transform:translateX(0)}50%,90%{transform:translateX(600px)}100%{transform:translateX(0)}}
.f1{animation:a1 8s ease-in-out infinite}.f2{animation:a2 8s ease-in-out infinite}
@keyframes a1{0%,40%{opacity:1}50%,90%{opacity:.35}100%{opacity:1}}
@keyframes a2{0%,40%{opacity:.35}50%,90%{opacity:1}100%{opacity:.35}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="960" height="300" rx="16" fill="#141416"/><text x="48" y="52" fill="#F5F5F6" font-size="22" font-weight="700">AO1</text><text x="48" y="76" fill="#8b8b93" font-size="14">Chaque téléchargement reçoit une note de A+ à F</text><g class="f1"><rect x="48" y="104" width="330" height="56" rx="10" fill="#1d1d21" stroke="#2c2c31"/><rect x="64" y="118" width="26" height="28" rx="4" fill="#2c2c31"/><text x="104" y="129" fill="#F5F5F6" font-size="14.5" font-weight="600">python-installer.exe</text><text x="104" y="148" fill="#8b8b93" font-size="12.5">depuis python.org</text></g><g class="f2"><rect x="48" y="176" width="330" height="56" rx="10" fill="#1d1d21" stroke="#2c2c31"/><rect x="64" y="190" width="26" height="28" rx="4" fill="#2c2c31"/><text x="104" y="201" fill="#F5F5F6" font-size="14.5" font-weight="600">facture_2026.exe</text><text x="104" y="220" fill="#8b8b93" font-size="12.5">depuis un hébergeur éphémère</text></g><rect x="420" y="132" width="62" height="62" rx="12" fill="#2e9e6b"/><text x="451" y="172" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">A+</text><rect x="490" y="132" width="62" height="62" rx="12" fill="#4cc38a"/><text x="521" y="172" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">A</text><rect x="560" y="132" width="62" height="62" rx="12" fill="#9ccc65"/><text x="591" y="172" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">B</text><rect x="630" y="132" width="62" height="62" rx="12" fill="#e6c34a"/><text x="661" y="172" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">C</text><rect x="700" y="132" width="62" height="62" rx="12" fill="#e67e22"/><text x="731" y="172" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">D</text><rect x="770" y="132" width="62" height="62" rx="12" fill="#d9573f"/><text x="801" y="172" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">E</text><rect x="840" y="132" width="62" height="62" rx="12" fill="#b8322a"/><text x="871" y="172" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">F</text><g class="sel" transform="translate(0 0)"><rect x="416" y="128" width="70" height="70" rx="14" fill="none" stroke="#F5F5F6" stroke-width="2.5"/></g><text x="420" y="226" fill="#8b8b93" font-size="12.5">Sain</text><text x="902" y="226" text-anchor="end" fill="#8b8b93" font-size="12.5">Menace critique</text><text x="48" y="268" fill="#8b8b93" font-size="12.5">Bêta : une aide, pas un antivirus. Tout reste sur votre ordinateur.</text></svg>