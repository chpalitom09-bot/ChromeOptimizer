<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Une extension qui ne travaille que sur événement</title>
<desc id="d">Chrome signale des événements ; ChromeOptimizer ne s'active que ponctuellement à ces moments, le reste du temps rien ne tourne.</desc>
<style>
text{font-family:"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif}
.cursor{animation:sweep 8s linear infinite}
@keyframes sweep{0%{transform:translateX(0);opacity:0}3%{opacity:.55}97%{opacity:.55}100%{transform:translateX(810px);opacity:0}}
.blip{opacity:0;transform-box:fill-box;transform-origin:center;animation:blip 8s ease-out infinite}
@keyframes blip{0%{opacity:0;transform:scale(.4)}3%{opacity:1;transform:scale(1.8)}12%,100%{opacity:0;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.cursor,.blip{animation:none}.cursor{opacity:0}}
</style>
<rect width="1000" height="280" rx="18" fill="#0E1A2B"/>
<text x="36" y="86" font-size="16" font-weight="700" fill="#E6EEF7">Chrome</text>
<line x1="150" y1="80" x2="960" y2="80" stroke="#263B57" stroke-width="2"/>
<rect x="225" y="69" width="10" height="22" rx="3" fill="#FFB347"/>
<rect x="335" y="69" width="10" height="22" rx="3" fill="#FFB347"/>
<rect x="475" y="69" width="10" height="22" rx="3" fill="#FFB347"/>
<rect x="605" y="69" width="10" height="22" rx="3" fill="#FFB347"/>
<rect x="715" y="69" width="10" height="22" rx="3" fill="#FFB347"/>
<rect x="855" y="69" width="10" height="22" rx="3" fill="#FFB347"/>
<text x="230" y="116" font-size="13" fill="#8AA0BA" text-anchor="middle">onglet activé</text>
<text x="480" y="116" font-size="13" fill="#8AA0BA" text-anchor="middle">page chargée</text>
<text x="720" y="116" font-size="13" fill="#8AA0BA" text-anchor="middle">alarme, une fois par minute</text>
<line x1="230" y1="134" x2="230" y2="192" stroke="#263B57" stroke-dasharray="3 5"/>
<line x1="340" y1="134" x2="340" y2="192" stroke="#263B57" stroke-dasharray="3 5"/>
<line x1="480" y1="134" x2="480" y2="192" stroke="#263B57" stroke-dasharray="3 5"/>
<line x1="610" y1="134" x2="610" y2="192" stroke="#263B57" stroke-dasharray="3 5"/>
<line x1="720" y1="134" x2="720" y2="192" stroke="#263B57" stroke-dasharray="3 5"/>
<line x1="860" y1="134" x2="860" y2="192" stroke="#263B57" stroke-dasharray="3 5"/>
<text x="36" y="206" font-size="16" font-weight="700" fill="#E6EEF7">ChromeOptimizer</text>
<line x1="150" y1="200" x2="960" y2="200" stroke="#263B57" stroke-width="2"/>
<circle cx="230" cy="200" r="3" fill="#8AA0BA"/><circle class="blip" style="animation-delay:0.79s" cx="230" cy="200" r="7" fill="#3DD6F5"/>
<circle cx="340" cy="200" r="3" fill="#8AA0BA"/><circle class="blip" style="animation-delay:1.88s" cx="340" cy="200" r="7" fill="#3DD6F5"/>
<circle cx="480" cy="200" r="3" fill="#8AA0BA"/><circle class="blip" style="animation-delay:3.26s" cx="480" cy="200" r="7" fill="#3DD6F5"/>
<circle cx="610" cy="200" r="3" fill="#8AA0BA"/><circle class="blip" style="animation-delay:4.54s" cx="610" cy="200" r="7" fill="#3DD6F5"/>
<circle cx="720" cy="200" r="3" fill="#8AA0BA"/><circle class="blip" style="animation-delay:5.63s" cx="720" cy="200" r="7" fill="#3DD6F5"/>
<circle cx="860" cy="200" r="3" fill="#8AA0BA"/><circle class="blip" style="animation-delay:7.01s" cx="860" cy="200" r="7" fill="#3DD6F5"/>
<line class="cursor" x1="150" y1="58" x2="150" y2="220" stroke="#3DD6F5" stroke-width="2" opacity="0"/>
<text x="500" y="256" font-size="15" fill="#8AA0BA" text-anchor="middle">Entre deux événements, rien ne tourne : le service worker de l'extension s'endort.</text>
</svg>
